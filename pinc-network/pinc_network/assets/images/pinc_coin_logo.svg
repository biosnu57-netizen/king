<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <defs>
    <linearGradient id="coinGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00D4AA;stop-opacity:1" />
      <stop offset="25%" style="stop-color:#00FF94;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00D4AA;stop-opacity:1" />
      <stop offset="75%" style="stop-color:#00FF94;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00D4AA;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="innerCoin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A2028;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0A0E14;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="shine" cx="30%" cy="30%" r="50%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Coin Outer Ring -->
  <circle cx="256" cy="256" r="240" fill="url(#coinGradient)"/>
  
  <!-- Coin Inner Circle -->
  <circle cx="256" cy="256" r="210" fill="url(#innerCoin)"/>
  
  <!-- Shine Effect -->
  <circle cx="256" cy="256" r="210" fill="url(#shine)"/>
  
  <!-- PINC Text - Top -->
  <text x="256" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="url(#coinGradient)">PINC</text>
  
  <!-- Decorative Line -->
  <rect x="120" y="200" width="272" height="4" rx="2" fill="url(#coinGradient)" opacity="0.5"/>
  
  <!-- Coin Symbol - Center -->
  <circle cx="256" cy="300" r="80" fill="none" stroke="url(#coinGradient)" stroke-width="4"/>
  <text x="256" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="60" font-weight="bold" fill="url(#coinGradient)">₿</text>
  
  <!-- Network Lines -->
  <line x1="256" y1="220" x2="256" y2="150" stroke="#00D4AA" stroke-width="3" opacity="0.6"/>
  <line x1="180" y1="280" x2="120" y2="220" stroke="#00FF94" stroke-width="3" opacity="0.6"/>
  <line x1="332" y1="280" x2="392" y2="220" stroke="#00D4AA" stroke-width="3" opacity="0.6"/>
  
  <!-- Small Nodes -->
  <circle cx="256" cy="140" r="8" fill="#00D4AA"/>
  <circle cx="115" cy="215" r="8" fill="#00FF94"/>
  <circle cx="397" cy="215" r="8" fill="#00D4AA"/>
  
  <!-- Bottom Text -->
  <text x="256" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#00D4AA">COIN</text>
  
  <!-- Currency Symbol Small -->
  <text x="256" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#00FF94">DECENTRALIZED</text>
</svg>