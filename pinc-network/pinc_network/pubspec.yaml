name: pinc_network
description: "PINC Network - Decentralized Privacy-First Platform"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  
  # Local Storage
  # flutter_secure_storage: ^9.2.2  # Disabled for Linux compatibility
  shared_preferences: ^2.2.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Encryption & Security
  encrypt: ^5.0.3
  crypto: ^3.0.3
  pointycastle: ^3.9.1
  uuid: ^4.4.2
  local_auth: ^2.2.0
  
  # Networking
  dio: ^5.4.3+1
  web_socket_channel: ^2.4.5
  connectivity_plus: ^6.0.3
  
  # UI Components
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0
  
  # QR Code
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.1.1
  
  # Image
  image_picker: ^1.1.2
  
  # Permissions
  permission_handler: ^11.3.1
  
  # Isolate for parallel processing
  flutter_isolate: ^2.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true